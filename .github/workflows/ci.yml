name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install kerygma-profiles from GitHub
        run: pip install "git+https://${{ secrets.GITHUB_TOKEN }}@github.com/organvm-vii-kerygma/kerygma-profiles.git"
      - run: pip install -e ".[dev]"
      - name: Type check with pyright
        run: |
          pip install pyright
          pyright kerygma_social/
      - run: python -m pytest tests/ -v
      - run: python -m ruff check kerygma_social/
